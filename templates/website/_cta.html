{% load site_tags %}
<section class="cta">
  <div class="container">
    <div class="cta__panel reveal">
      <span class="cta__ring cta__ring--a" aria-hidden="true"></span>
      <span class="cta__ring cta__ring--b" aria-hidden="true"></span>
      <div class="cta__copy">
        <p class="eyebrow eyebrow--light">{{ t.eyebrow_contact }}</p>
        <h2>{{ t.cta_band_title }}</h2>
        <p>{{ t.cta_band_text }}</p>
      </div>
      <div class="cta__actions">
        <a class="btn btn--light btn--lg" href="{% url 'contact' %}{% if service %}?service={{ service.slug }}{% endif %}">{{ t.cta_quote }} {% icon "arrow" 20 %}</a>
        {% if company.whatsapp_digits %}<a class="btn btn--glass btn--lg" href="https://wa.me/{{ company.whatsapp_digits }}" target="_blank" rel="noopener">{% icon "whatsapp" 20 %} {{ t.cta_whatsapp }}</a>{% endif %}
      </div>
    </div>
  </div>
</section>
